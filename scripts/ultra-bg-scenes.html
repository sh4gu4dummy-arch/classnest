<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #111; }
  .grid { display: grid; grid-template-columns: repeat(5, 768px); gap: 8px; padding: 8px; }
  .scene { width: 768px; height: 768px; position: relative; overflow: hidden; }
  .scene > * { position: absolute; inset: 0; }

  /* 21 s2 windowsill day */
  .q2 { background: linear-gradient(#d7dde6, #c4b8a8 55%, #b09a82); }
  .q2 .win { inset: 8% 10% auto 10%; height: 48%;
    background: linear-gradient(#9bb4c9, #c5d4e0);
    box-shadow: inset 0 0 0 18px #e8dfd2, inset 0 0 0 22px #c4b29a;
    border-radius: 4px; }
  .q2 .muntin-v { left: 50%; width: 10px; top: 8%; height: 48%; background: #e8dfd2; transform: translateX(-50%); }
  .q2 .sill { top: 54%; height: 8%; background: linear-gradient(#efe6d8, #cbb89a); box-shadow: 0 10px 20px rgba(0,0,0,.15); }
  .q2 .plant { left: 12%; top: 38%; width: 90px; height: 140px;
    background: radial-gradient(circle at 40% 30%, #3f7a4a, #1f4a28 70%);
    border-radius: 50% 50% 45% 45%; filter: blur(.3px); }
  .q2 .pot { left: 18%; top: 52%; width: 50px; height: 36px; background: #8b4b32; border-radius: 4px 4px 8px 8px; }

  /* 21 s3 moonlit conservatory */
  .q3 { background: #0d1420; }
  .q3 .night { background:
    radial-gradient(circle at 78% 18%, #e8f0ff 0 14px, transparent 15px),
    linear-gradient(#152238, #0b1018 60%, #1a140f); }
  .q3 .win { inset: 6% 8% auto 8%; height: 62%;
    background: linear-gradient(180deg, #1c2c44, #24344c 40%, #1a2433);
    box-shadow: inset 0 0 0 16px #3a2a1c, 0 0 80px rgba(80,120,180,.25);
    border-radius: 6px; }
  .q3 .rain { background: repeating-linear-gradient(105deg, transparent 0 18px, rgba(200,220,255,.12) 19px, transparent 21px); mix-blend-mode: screen; opacity: .55; }
  .q3 .lamp { left: 14%; top: 58%; width: 70px; height: 70px;
    background: radial-gradient(circle, #ffd089 0 18px, rgba(255,180,70,.35) 28px, transparent 60%); }
  .q3 .ivy { left: 8%; top: 8%; width: 22%; height: 70%;
    background: radial-gradient(8px 14px at 30% 20%, #245230 40%, transparent 42%),
                radial-gradient(10px 16px at 60% 40%, #1d4628 40%, transparent 42%),
                radial-gradient(9px 15px at 40% 65%, #2a5a32 40%, transparent 42%); opacity: .85; }

  /* 22 s2 hearth hint */
  .h2 { background: linear-gradient(#e4c9a4, #c99562 70%, #8a5a32); }
  .h2 .glow { inset: auto 20% 0 20%; height: 40%;
    background: radial-gradient(ellipse at 50% 100%, #ffb060 0%, transparent 70%); opacity: .7; }
  .h2 .floor { top: 68%; background: repeating-linear-gradient(90deg, #8b5a32 0 48px, #7a4c28 48px 52px); }

  /* 22 s3 lodge */
  .h3 { background: #2a1a10; }
  .h3 .room { background: linear-gradient(#3d2818, #1a100a); }
  .h3 .beams { background: repeating-linear-gradient(90deg, transparent 0 110px, rgba(40,22,10,.55) 110px 128px); }
  .h3 .fire { left: 50%; bottom: 4%; width: 340px; height: 260px; transform: translateX(-50%);
    background:
      radial-gradient(ellipse 70% 50% at 50% 88%, #ffe08a 0 12%, #ff8a20 34%, transparent 58%),
      radial-gradient(ellipse 90% 40% at 50% 100%, #4a2814 0 50%, transparent 70%);
    filter: blur(0.4px); }
  .h3 .mantel { left: 50%; bottom: 0; width: 380px; height: 28px; transform: translateX(-50%);
    background: #3a2416; border-radius: 4px; box-shadow: 0 -8px 30px rgba(255,120,20,.25); }
  .h3 .win { right: 8%; top: 12%; width: 22%; height: 28%;
    background: linear-gradient(#c47a32, #7a3a12); box-shadow: inset 0 0 0 8px #4a2c18; }

  /* 23 s2 mist woods */
  .m2 { background: linear-gradient(#c5c0b6, #9a9388); }
  .m2 .fog { background: radial-gradient(ellipse at 50% 80%, rgba(255,255,255,.45), transparent 60%); }
  .m2 .t1 { left: 6%; top: 8%; width: 70px; height: 85%; background: linear-gradient(#6a6258, #3e3933); border-radius: 40px; filter: blur(1px); opacity: .55; }
  .m2 .t2 { right: 8%; top: 4%; width: 90px; height: 95%; background: linear-gradient(#5c564c, #2f2b27); border-radius: 50px; filter: blur(1.5px); opacity: .4; }

  /* 23 s3 ancient grove */
  .m3 { background: linear-gradient(#2c3340, #12161c 70%, #1a2018); }
  .m3 .rays { background: conic-gradient(from 200deg at 70% -10%, transparent 0 8%, rgba(255,230,180,.18) 10%, transparent 14%); }
  .m3 .stone { left: 8%; bottom: 12%; width: 90px; height: 210px; background: #3a4148; border-radius: 8px; box-shadow: 0 0 20px rgba(180,200,220,.15); transform: rotate(-6deg); }
  .m3 .stone2 { right: 10%; bottom: 18%; width: 70px; height: 160px; background: #32383e; border-radius: 8px; transform: rotate(8deg); }
  .m3 .fern { left: 0; bottom: 0; height: 28%; background: linear-gradient(transparent, #1a2a18); }
  .m3 .mist { background: radial-gradient(ellipse at 50% 70%, rgba(200,210,220,.28), transparent 55%); }

  /* 24 s2 pond */
  .t2 { background: linear-gradient(#9aaa78, #6a8a62 50%, #3d6a58); }
  .t2 .water { top: 58%; background: linear-gradient(#4d7a6a, #2a4a42); }
  .t2 .lily { left: 12%; top: 66%; width: 70px; height: 28px; background: #3a6a32; border-radius: 50%; }
  .t2 .lily2 { right: 16%; top: 72%; width: 56px; height: 22px; background: #2f5a2a; border-radius: 50%; }

  /* 24 s3 temple pond */
  .t3 { background: linear-gradient(#3a4a28, #1a2418 40%, #0e2a28); }
  .t3 .water { top: 52%; background: linear-gradient(#1a4a44, #0a2422); box-shadow: inset 0 20px 40px rgba(255,200,80,.08); }
  .t3 .lan { left: 10%; top: 28%; width: 36px; height: 70px;
    background: linear-gradient(#6a3a18, #3a200c); border-radius: 6px;
    box-shadow: 0 0 30px 8px rgba(255,170,60,.45); }
  .t3 .lan::after { content:""; position:absolute; inset: 18px 6px 22px; background: #ffb040; border-radius: 4px; }
  .t3 .lan2 { right: 12%; top: 22%; width: 32px; height: 64px;
    background: linear-gradient(#6a3a18, #3a200c); border-radius: 6px;
    box-shadow: 0 0 28px 8px rgba(255,170,60,.4); }
  .t3 .moss { left: 0; top: 0; width: 30%; background: radial-gradient(circle at 20% 10%, #2a4a22 0 40px, transparent 42%); }
  .t3 .lily { left: 18%; top: 70%; width: 80px; height: 26px; background: #245828; border-radius: 50%; }

  /* 25 s2 dawn hint */
  .d2 { background: linear-gradient(#f3e2c8, #e8c9a4 55%, #c9a078); }
  .d2 .roof { left: 0; bottom: 0; height: 22%;
    background: linear-gradient(#8a6a52, #5a4030);
    clip-path: polygon(0 60%, 18% 20%, 32% 55%, 48% 10%, 70% 50%, 88% 18%, 100% 58%, 100% 100%, 0 100%); }

  /* 25 s3 dawn cathedral */
  .d3 { background: linear-gradient(#ffd8a0 0%, #f0b070 35%, #7a8aaa 70%, #4a5a78); }
  .d3 .sun { left: 62%; top: 12%; width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, #fff6d0, #ffcc66 40%, transparent 70%); }
  .d3 .cloud { left: 8%; top: 28%; width: 40%; height: 16%; background: rgba(255,255,255,.35); border-radius: 50%; filter: blur(8px); }
  .d3 .cloud2 { right: 4%; top: 36%; width: 36%; height: 14%; background: rgba(255,240,220,.3); border-radius: 50%; filter: blur(10px); }
  .d3 .roof { left: 0; bottom: 0; height: 26%;
    background: linear-gradient(#4a3a38, #2a2020);
    clip-path: polygon(0 70%, 14% 28%, 28% 62%, 42% 18%, 58% 58%, 74% 22%, 90% 64%, 100% 40%, 100% 100%, 0 100%); }
</style>
</head>
<body>
<div class="grid">
  <div class="scene q2" id="bg-21-s2"><div class="win"></div><div class="muntin-v"></div><div class="sill"></div><div class="plant"></div><div class="pot"></div></div>
  <div class="scene q3" id="bg-21-s3"><div class="night"></div><div class="win"></div><div class="rain"></div><div class="ivy"></div><div class="lamp"></div></div>
  <div class="scene h2" id="bg-22-s2"><div class="floor"></div><div class="glow"></div></div>
  <div class="scene h3" id="bg-22-s3"><div class="room"></div><div class="beams"></div><div class="win"></div><div class="fire"></div><div class="mantel"></div></div>
  <div class="scene m2" id="bg-23-s2"><div class="t1"></div><div class="t2"></div><div class="fog"></div></div>
  <div class="scene m3" id="bg-23-s3"><div class="rays"></div><div class="stone"></div><div class="stone2"></div><div class="fern"></div><div class="mist"></div></div>
  <div class="scene t2" id="bg-24-s2"><div class="water"></div><div class="lily"></div><div class="lily2"></div></div>
  <div class="scene t3" id="bg-24-s3"><div class="water"></div><div class="lan"></div><div class="lan2"></div><div class="moss"></div><div class="lily"></div></div>
  <div class="scene d2" id="bg-25-s2"><div class="roof"></div></div>
  <div class="scene d3" id="bg-25-s3"><div class="sun"></div><div class="cloud"></div><div class="cloud2"></div><div class="roof"></div></div>
</div>
</body>
</html>
