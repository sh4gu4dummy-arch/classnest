<body>
<header>
  <h1><span id="h-title">ClassNest preview</span> <span class="note" id="h-note">· local only</span></h1>
  <div class="row tabs"><button id="tab-home">Sets</button><button id="tab-summary">Summary</button></div>
  <div class="row" id="subbar" style="margin-top:6px"></div>
</header>
<main id="main"></main>
<div id="copybar"><span class="count" id="count"></span><button id="copy">Copy</button></div>
<div id="toast" role="status"><span id="toast-t"></span><button id="toast-undo" class="pill">Undo</button></div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Full size image">
  <div class="top"><div class="cap" id="lb-cap"></div><button class="x" id="lb-x" aria-label="Close">✕</button></div>
  <div class="stage" id="lb-stage"><button class="nav prev" id="lb-prev" aria-label="Previous">‹</button><div id="lb-media" style="display:contents"></div><button class="nav next" id="lb-next" aria-label="Next">›</button></div>
  <div class="pinbox" id="lb-pin"></div>
  <div id="lb-menu"></div>
  <div class="bottom" id="lb-vote"></div>
</div>
<script>
/* ClassNest review v2 — works like Number Pictures' review:
   - the queue ("To review") only shows items that are undecided and not shipped/done
   - verdicts carry the art stamp; when the art changes the old verdict drops itself
   - copying the summary clears the copied verdicts (tombstones on the server, so sync can't bring them back) */
const LS_KEY = "classnest-review-v1";               // versioned; survives app version bumps
/* Static mode (GitHub Pages build): no /api; sets/meta/verdicts come from data/*.json (relative paths only),
   votes live in this browser's localStorage only. build-pages.sh flips STATIC_BUILD; otherwise auto-detected
   when /api/sets is unreachable. */
const STATIC_BUILD = false;
let STATIC = STATIC_BUILD;
const REMAKE_TEMPLATES = [
  "not enough change", "style doesn't match", "angry / scary, not cute", "off-model / drift", "too foal-like",
  "anatomy (extra legs / extra horse)", "text or letters", "too soft / blurry", "lost the pose", "colours drifted",
];
const FILTERS = [["todo","To review"],["yes","Confirm"],["no","Remake"],["reject","Reject"],["comment","Commented"],["sent","Sent"],["done","Shipped / done"],["all","All"]];
let sets = [], set = null, route = {view:"home"}, ultraQuery = "", version = "";
let filter = localStorage.getItem(LS_KEY + ":filter2") || "todo";
let menuFor = null;                 // key whose REMAKE reason menu is open (cards)
const sticky = new Set();           // keys kept on screen once you start typing in them / open their REMAKE menu (until a vote, filter or page change)
let store = loadLocal();

function loadLocal(){ try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); return s && s.items ? s : {version:1, items:{}}; } catch { return {version:1, items:{}}; } }
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch {} }
const keyOf = (s, it) => `${s.id}/${it.id}`;
const VOTE_NAME = {yes:"CONFIRM", no:"REMAKE", reject:"REJECT"};
const vName = (v) => VOTE_NAME[v] || "COMMENT";
/* ---- v2: stage model. Items may carry stage (1-3), role ("current" | "draft" | "reference"), letter, pick
   ("bot" | "alt" | "runner-up"), desc. Auto sets get them from set.json "itemRules" (first regex match on the
   file wins) and "autoLetters". Ultra sets are reference only: s1-s3 are the current art, no voting. */
const STAGE_NAMES = {1:"Hatchling", 2:"Adolescent", 3:"Legend"};
const letterOf = (n) => n < 26 ? String.fromCharCode(65 + n) : letterOf(Math.floor(n / 26) - 1) + String.fromCharCode(65 + n % 26);
function normalize(list){
  for (const s of list) {
    s.items ||= [];
    if (s.kind === "ultra") { s.noVote = true; for (const it of s.items) { const m = /^s([123])$/.exec(it.id); if (m) { it.stage = +m[1]; it.role = "current"; it.title = `Current ${STAGE_NAMES[it.stage]}`; } } }
    for (const it of s.items) {
      let m = null;
      const r = (s.itemRules || []).find((r) => { try { return (m = new RegExp(r.match).exec(it.file || it.id)); } catch { return false; } });
      if (!r) continue;
      const orig = it.title, sub = (v) => typeof v === "string" ? v.replace(/\$(\d)/g, (_, n) => m[n] ?? "") : v;   // "$1" = regex group
      for (const [k, v] of Object.entries(r)) if (k !== "match" && (k === "title" || k === "group" || it[k] === undefined)) it[k] = sub(v);
      if (it.role === "draft" && !it.desc && orig) it.desc = orig;
    }
    if (s.autoLetters) { const per = {}; for (const it of s.items) if (it.role === "draft" && !it.letter) it.letter = letterOf(per[it.stage] = (per[it.stage] ?? -1) + 1); }
    for (const it of s.items) {
      if (it.role === "draft") it.label = `${STAGE_NAMES[it.stage] || "Draft"} ${it.letter || ""}`.trim();
      else if (it.role === "current") it.label = it.title || `Current ${STAGE_NAMES[it.stage]}`;
      if (it.role === "reference") { it.group ||= "extras"; if (!(s.groups || []).some((g) => g.id === it.group)) (s.groups ||= []).push({id: it.group, title: "Extras (nothing to vote)"}); }
    }
    s.staged = s.items.some((it) => it.stage);
    /* "Keep current" option: in any voting set, a stage that has current art AND drafts gets a virtual item keep-sN.
       CONFIRM on it = keep today's art; it is mutually exclusive with CONFIRM on that stage's drafts. Generic for all sets. */
    if (s.kind !== "ultra" && !s.noVote) for (const st of [1, 2, 3]) {
      const cur = s.items.find((it) => it.stage === st && it.role === "current"), drafts = s.items.filter((it) => it.stage === st && it.role === "draft");
      if (!cur || !drafts.length || s.items.some((it) => it.id === `keep-s${st}`)) continue;
      const open = !s.shipped && !s.done && drafts.some((it) => !it.done && !it.shipped);
      s.items.push({id: `keep-s${st}`, stage: st, role: "keep", keepOf: cur.id, file: cur.file, thumb: cur.thumb, stamp: cur.stamp,
        title: `Keep current ${STAGE_NAMES[st]}`, label: `Keep current ${STAGE_NAMES[st]}`, ...(open ? {} : {done: "stage decided"})});
    }
  }
  return list;
}
const names = (ns) => ns.map((n) => STAGE_NAMES[n]).join(" and ");
const changing = (s) => [1, 2, 3].filter((n) => s.items.some((it) => it.stage === n && it.role === "draft"));
const shortTitle = (s) => s.kind === "ultra" ? s.title : s.title.replace(/\s+(s\d.*|drafts?)$/i, "");
function headline(s){
  if (s.headline) return s.headline;
  if (s.kind === "ultra") return `${s.title}: the art in the app now. Nothing to vote here.`;
  const ch = changing(s); if (!ch.length) return "";
  const stay = [1, 2, 3].filter((n) => !ch.includes(n));
  return `${shortTitle(s)}: pick a new ${names(ch)}.${stay.length ? ` ${names(stay)} stay${stay.length === 1 ? "s" : ""}.` : ""}`;
}
/* The badge every card / lightbox shows: what this picture IS. */
function badgeOf(s, it){
  const st = STAGE_NAMES[it.stage];
  if (it.role === "current") return s.kind !== "ultra" && !s.items.some((x) => x.stage === it.stage && x.role === "draft")
    ? {cls:"now", t:"NOW · style reference, not changing"} : {cls:"now", t:"NOW IN APP"};
  if (it.role === "draft") return {cls:"draft", t:`DRAFT · would replace ${st}`};
  if (it.role === "reference") return {cls:"ref", t:"REFERENCE · nothing to vote"};
  return null;
}
const pickTag = (it) => it.pick === "bot" ? `<span class="ptag">★ Bot pick</span>` : it.pick === "alt" ? `<span class="ptag alt">Alt pick</span>` : it.pick === "runner-up" ? `<span class="ptag ru">Runner-up</span>` : "";
const nameOf = (it) => it.label || it.title;
const clean = (t) => (t||"").replace(/\s+/g," ").trim();
const stale = (e, it) => !!(e && e.stamp && it.stamp && e.stamp !== it.stamp);
const rawOf = (s, it) => { const e = store.items[keyOf(s, it)]; return e && !stale(e, it) ? e : null; };
const isActive = (e) => !!(e && !e.cleared && (e.vote || clean(e.comment)));
const isSent = (e) => !!(e && e.cleared && e.sent);
/* What the card shows: the live verdict (never a cleared one). */
const entryOf = (s, it) => { const e = rawOf(s, it); return isActive(e) ? e : {vote:null, reasons:[], comment:"", history:e?.history||[]}; };
const decided = (s, it) => { const e = rawOf(s, it); return isActive(e) || isSent(e); };
function groupOf(s, it){ return (s.groups||[]).find((g) => g.id === (it.group || "_")); }
/* One source of "done": shipped/done on the item, its group or its set (or a shipped verdict). */
function doneOf(s, it){
  const e = rawOf(s, it), g = groupOf(s, it);
  if (it.shipped) return `SHIPPED ${it.shipped}`; if (it.done) return it.done;
  if (g?.shipped) return `SHIPPED ${g.shipped}`; if (g?.done) return g.done;
  if (s.shipped) return `SHIPPED ${s.shipped}`; if (s.done) return s.done;
  if (e?.shipped) return `SHIPPED ${e.shipped}`;
  return "";
}

}
function nowCard(s, it){
  const b = badgeOf(s, it), kp = keepOf(s, it.stage);
  let keep = "";

    const ke = entryOf(s, kp), on = ke.vote === "yes";
    keep = `<div class="vote keep"><button class="y ${on ? "on" : ""}" data-vote="yes" data-id="${esc(kp.id)}" aria-pressed="${on}">✓ CONFIRM: Keep current</button></div>
  <div class="note">${on ? `Keeping today's ${STAGE_NAMES[it.stage]}. Picking a draft below switches this off.` : `Like none of the drafts? Keep this ${STAGE_NAMES[it.stage]} instead.`}</div>
  ${on ? `<button class="clearbtn" data-clear="${esc(kp.id)}">Clear</button>` : ""}`;
  }
  return `<div class="card now ${keep && entryOf(s, kp).vote === "yes" ? "yes" : ""}"><span class="sbadge now">${esc(b.t)}</span>
  <img class="media" src="${cardImg(s, it)}" alt="${esc(nameOf(it))}" loading="lazy" data-zoom="${esc(it.id)}">
  <div class="body"><div class="title">${esc(nameOf(it))}</div><div class="note">Stage ${it.stage} · ${STAGE_NAMES[it.stage]} · in the app today${it.note ? " · " + esc(it.note) : ""}</div>${keep}</div></div>`;
}
function card(s, it){
  if (it.role === "current") return nowCard(s, it);

  const hist = (raw?.history||[]).length ? `<details class="hist"><summary>History (${raw.history.length})</summary><ul>${raw.history.map((h) => `<li>${esc(when(h.at))} — ${esc(h.reason)}</li>`).join("")}</ul></details>` : "";
  const img = cardImg(s, it);
  const box = (ph) => `<textarea placeholder="${esc(ph)}" data-comment="${esc(it.id)}" data-key="${esc(k)}" rows="2" enterkeyhint="done">${esc(e.comment||"")}</textarea>`;

  <div class="chips">${REMAKE_TEMPLATES.map((r) => `<button data-reason="${esc(r)}" data-id="${esc(it.id)}" class="${(e.reasons||[]).includes(r) ? "on" : ""}">${esc(r)}</button>`).join("")}</div>
  <button class="wide n" data-reason="__typed" data-id="${esc(it.id)}">✕ REMAKE with my reason</button><button class="wide" data-reason="" data-id="${esc(it.id)}">REMAKE (no reason)</button><button class="clearbtn" data-menuclose="1">Cancel</button></div>` : "";
  const votes = canVote(s, it) ? `<div class="vote"><button class="y ${e.vote==="yes"?"on":""}" data-vote="yes" data-id="${esc(it.id)}">✓ CONFIRM</button><button class="n ${e.vote==="no"||menuFor===k?"on":""}" data-vote="no" data-id="${esc(it.id)}">✕ REMAKE…</button><button class="r ${e.vote==="reject"?"on":""}" data-vote="reject" data-id="${esc(it.id)}" aria-pressed="${e.vote==="reject"}">⊘ REJECT</button></div>
  <label class="crow"><span class="note">${menuFor === k ? "Remake reason (saved as you type)" : "Comment (saved as you type)"}</span>${box(menuFor === k ? "Your reason, e.g. arms look odd" : "Comment or your own remake reason")}</label>
  ${menu}
  ${e.vote || clean(e.comment) ? `<button class="clearbtn" data-clear="${esc(it.id)}">Clear verdict</button>` : ""}` : "";
  const rej = isRejected(s, it), rtag = rej ? `<span class="rtag">REJECTED</span>` : "";
  const head = b ? `<span class="sbadge ${b.cls}">${esc(b.t)}${rtag}${done ? `<span class="done">${esc(done)}</span>` : ""}</span>` : done ? `<span class="badge">${esc(done)}</span>${rtag}` : rtag;
  const ttl = it.role === "draft"
    ? `<div class="ttl"><span class="letter">${esc(it.letter || "?")}</span>${esc(nameOf(it))}${pickTag(it)}</div>${it.desc ? `<div class="desc">${esc(it.desc)}</div>` : ""}`
    : `<div class="title">${it.kind === "video" ? "▶ " : ""}${esc(nameOf(it))}</div>`;
  return `<div class="card ${it.role || ""} ${e.vote||""} ${rej && e.vote !== "reject" ? "reject" : ""}" ${rej ? `data-rejected="1"` : ""}>${head}
  <img class="media" src="${img}" alt="${esc(nameOf(it))}" loading="lazy" data-zoom="${esc(it.id)}">
  <div class="body">${ttl}${pin ? `<div class="pin ${pin.cls}">${esc(pin.t)}</div>` : ""}${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}
  ${votes}${hist}<div class="saved" data-saved="${esc(k)}"></div></div></div>`;
}
function tile(s, it){
  const e = entryOf(s, it);
  return `<button class="tile ${e.vote||""} ${isRejected(s, it) && e.vote !== "reject" ? "reject" : ""}" data-zoom="${esc(it.id)}"><img src="${thumb(s, it)}" alt="" loading="lazy"><div class="cap">${esc(nameOf(it))}</div></button>`;

let shownOrder = [];                 // items in the order they are on screen (lightbox ‹ › follows it)
function visibleItems(){ return shownOrder.map((x) => x.it); }
function renderStaged(){
  const s = set, hl = headline(s), more = s.details || s.blurb;
  let html = `${hl ? `<p class="headline">${esc(hl)}</p>` : ""}${more ? `<details class="more"><summary>Details</summary><p class="blurb">${esc(more)}</p></details>` : ""}`;
  const order = [];
  for (const st of [1, 2, 3]) {
    const cur = s.items.filter((it) => it.stage === st && it.role === "current"), drafts = s.items.filter((it) => it.stage === st && it.role !== "current" && it.role !== "keep");
    if (!cur.length && !drafts.length) continue;
    const shown = drafts.filter((it) => passes(s, it)), nm = STAGE_NAMES[st];
    const open = drafts.filter((it) => !doneOf(s, it)), shipCur = cur.find((it) => it.shipped);
    const sub = s.kind === "ultra" ? "In the app now."
      : open.length ? `${open.length} draft${open.length === 1 ? "" : "s"}. Pick one to replace the current ${nm}, REMAKE, or REJECT the ones you don't want.`
      : shipCur ? `Shipped ${shipCur.shipped}: the new ${nm} is in the app now. Nothing left to vote here.`

  }
  for (const g of s.groups || []) {
    const items = s.items.filter((it) => !it.stage && (it.group || "_") === g.id && (!canVote(s, it) || passes(s, it)));

    const compact = g.compact || g.id === "scrub" || g.id === "extras";
    html += `<h2>${esc(g.title || "")}</h2><div class="${compact ? "tiles" : "grid"}">${items.map((it) => compact ? tile(s, it) : card(s, it)).join("")}</div>`;
  }
  shownOrder = order.map((it) => ({s, it}));
  return html;
}
function renderSet(){
  if (set.staged) return renderStaged();
  const groups = set.groups?.length ? set.groups : [{id:"_", title:""}];
  let html = `<p class="blurb">${esc(set.blurb||"")}</p>`; let n = 0; const order = [];
  for (const g of groups) {
    const items = set.items.filter((it) => (it.group || "_") === g.id && passes(set, it));
    if (!items.length) continue; n += items.length; order.push(...items);
    const compact = g.compact || g.id === "scrub";
    html += `${g.title ? `<h2>${esc(g.title)}</h2>` : ""}<div class="${compact ? "tiles" : "grid"}">${items.map((it) => compact ? tile(set, it) : card(set, it)).join("")}</div>`;
  }
  shownOrder = order.map((it) => ({s: set, it}));
  if (n) return html;
  const msg = filter === "todo" ? (set.shipped ? `Everything here shipped (${esc(set.shipped)}). Nothing left to review.` : "Nothing left to review here ✓") : "Nothing here for this filter.";
  return html + `<p class="empty">${msg}</p>`;
}
/* The tap-to-copy block (Summary tab and top of Home): same text, same copy-then-clear, same fallback. */
function pendingBlock(text){
  return `<h2 class="sumhead">Pending — tap to copy <button id="sumcopy">Copy</button></h2><pre id="sumtext" title="Tap to copy">${esc(text)}</pre>
  <div id="fallback"><div class="note">Copy didn't work here. Select the text below and copy it, then tap “I copied it”.</div><textarea readonly>${esc(text)}</textarea><button class="wide" id="manualsent">I copied it — clear these</button></div>`;
}
function homeSummary(){
  const all = pendingEntries(), text = formatApprovals(all);
  return all.length ? `<div class="homesum" id="homesum">${pendingBlock(text)}</div>` : `<p class="note homesum-empty" id="homesum">Nothing to send yet</p>`;
}
let summaryList = [];
function renderSummary(){
  const all = pendingEntries(), text = formatApprovals(all);
  summaryList = all;
  const sec = (title, list, note) => list.length ? `<div class="sum-sec"><b>${title} (${list.length})</b>${list.map((x) => `<div class="sum-item"><img src="${thumb(x.s, x.item)}" data-sum="${esc(x.s.id)}|${esc(x.item.id)}" alt=""><div><div class="title">${esc(nameOf(x.item))}</div><div class="note">${esc(x.s.title)} · ${esc(x.item.id)}${note(x) ? " — " + esc(note(x)) : ""}</div></div></div>`).join("")}</div>` : "";
  const sent = [];
  for (const s of sets) for (const it of s.items) { const e = rawOf(s, it); if (isSent(e) && !doneOf(s, it)) sent.push({s, it, e}); }
  sent.sort((a, b) => b.e.sent.at - a.e.sent.at);
  return `${all.length ? "" : `<p class="empty">Nothing to send. Everything you voted on has been copied or shipped.</p>`}
  ${sec("CONFIRM", all.filter((x) => x.e.vote==="yes"), (x) => clean(x.e.comment))}
  ${sec("REMAKE", all.filter((x) => x.e.vote==="no"), remakeNote)}
  ${sec("REJECT", all.filter((x) => x.e.vote==="reject"), (x) => clean(x.e.comment))}
  ${sec("COMMENT", all.filter((x) => !x.e.vote && clean(x.e.comment)), (x) => clean(x.e.comment))}
  ${all.length ? pendingBlock(text) : ""}
  ${sent.length ? `<details class="shipped"><summary>Sent, waiting on the bot (${sent.length})</summary>${sent.slice(0, 40).map((x) => `<div class="note">${esc(when(x.e.sent.at))} · ${esc(x.s.title)}: ${esc(x.it.id)} — ${vName(x.e.sent.vote)}${(x.e.sent.reasons||[]).length ? " · " + esc(x.e.sent.reasons.join("; ")) : ""}</div>`).join("")}</details>` : ""}`;
}
function parseRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  if (h.startsWith("set/")) { const s = sets.find((x) => x.id === decodeURIComponent(h.slice(4))); if (s) return {view:"set", s}; }
  if (h === "summary" || (!h && location.pathname === "/summary")) return {view:"summary"};

}
function go(hash){ if (location.hash !== hash) location.hash = hash; else onRoute(); }
function onRoute(){ closeLb(); menuFor = null; sticky.clear(); route = parseRoute(); set = route.s || null; render(); window.scrollTo(0, 0); }
const busyTyping = () => { const a = document.activeElement; return !!(a && a.dataset && a.dataset.comment); };

  return all.length ? [`${y} confirm`, `${n} remake`, r && `${r} reject`, c && `${c} comment`].filter(Boolean).join(" · ") + " to send" : "Nothing to send"; }
function render(){
  const v = route.view;
  document.getElementById("tab-home").classList.toggle("on", v !== "summary");
  document.getElementById("tab-summary").classList.toggle("on", v === "summary");
  document.getElementById("h-title").textContent = v === "set" ? set.title : "ClassNest preview";
  const todoN = v === "set" ? set.items.filter((it) => inQueue(set, it)).length : 0;
  const votable = v === "set" && set.items.some((it) => canVote(set, it));
  document.getElementById("subbar").innerHTML = v === "set"
    ? `<button class="pill" data-home="1">← All sets</button>${set.shipped ? `<span class="badge">SHIPPED ${esc(set.shipped)}</span>` : ""}` + (!votable ? `<span class="note">Reference only · nothing to vote</span>` : "") + (!votable ? [] : FILTERS).map(([id, label]) => `<button class="pill ${filter===id?"on":""}" data-filter="${id}">${label}${id === "todo" ? ` (${todoN})` : ""}</button>`).join("")
    : "";
  document.getElementById("subbar").style.display = v === "set" ? "" : "none";
  const keep = window.scrollY, ae = document.activeElement, focusId = ae && ae.id;
  const typing = ae && ae.dataset && ae.dataset.key ? {k: ae.dataset.key, a: ae.selectionStart, b: ae.selectionEnd} : null;
  const main = document.getElementById("main");
  main.style.setProperty("--ar", set?.aspect || "1");
  main.innerHTML = !sets.length ? `<p class="empty">Loading…</p>` : v === "set" ? renderSet() : v === "summary" ? renderSummary() : renderHome();
  window.scrollTo(0, keep);
  if (focusId === "uq") { const i = document.getElementById("uq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  if (typing) { const t = main.querySelector(`textarea[data-key="${CSS.escape(typing.k)}"]`); if (t) { t.focus({preventScroll:true}); try { t.setSelectionRange(typing.a, typing.b); } catch {} } }

  document.getElementById("count").textContent = countText(all);

document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-set],[data-home],[data-vote],[data-reason],[data-filter],[data-zoom],[data-sum],[data-clear],[data-menuclose]"); if (!t || t.closest("#lb")) return;
  const find = (id) => set.items.find((x) => x.id === id);
  if (t.dataset.set) { go("#/set/" + encodeURIComponent(t.dataset.set)); return; }
  if (t.dataset.home) { go("#/"); return; }
  if (t.dataset.vote === "yes") { menuFor = null; const it = find(t.dataset.id); sticky.delete(keyOf(set, it)); confirmItem(set, it); return; }
  if (t.dataset.vote === "reject") { const it = find(t.dataset.id); sticky.delete(keyOf(set, it)); rejectItem(set, it); return; }
  if (t.dataset.vote === "no") { const k = keyOf(set, find(t.dataset.id)); menuFor = menuFor === k ? null : k; if (menuFor) sticky.add(k); render(); if (menuFor) focusRemakeBox(k); return; }
  if (t.dataset.reason !== undefined) { const it = find(t.dataset.id); sticky.delete(keyOf(set, it)); remakeItem(set, it, t.dataset.reason === "__typed" ? "" : t.dataset.reason); return; }
  if (t.dataset.clear) { clearItem(set, find(t.dataset.clear)); return; }
  if (t.dataset.menuclose) { menuFor = null; render(); return; }
  if (t.dataset.filter) { filter = t.dataset.filter; localStorage.setItem(LS_KEY + ":filter2", filter); sticky.clear(); menuFor = null; render(); return; }
  if (t.dataset.zoom) { const list = visibleItems().map((it) => ({s: set, it})); openLb(list, Math.max(0, list.findIndex((x) => x.it.id === t.dataset.zoom))); return; }
  if (t.dataset.sum) { const [sid, iid] = t.dataset.sum.split("|"); const list = summaryList.map((x) => ({s: x.s, it: x.item})); openLb(list, Math.max(0, list.findIndex((x) => x.s.id === sid && x.it.id === iid))); return; }
});
/* Comments save on every keystroke (debounced to the server) so nothing is lost on phones; the card stays put while typing. */
let commentTimers = {};
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "uq") { ultraQuery = t.value; render(); return; }
  if (t.dataset.comment && t.dataset.key) {
    const k = t.dataset.key, i = k.indexOf("/"), cs = sets.find((x) => x.id === k.slice(0, i)), it = cs?.items.find((x) => x.id === k.slice(i + 1));
    if (!it) return;
    sticky.add(k);
    const e = entryOf(cs, it);
    setEntry(cs, it, {comment: t.value}, null, {quiet:true});
    clearTimeout(commentTimers[k]);
    commentTimers[k] = setTimeout(() => { const raw = store.items[k]; if (raw && raw.history && clean(t.value) && !(raw.history[0]||{}).reason?.startsWith("comment")) { raw.history = [{at: Date.now(), reason: `comment: ${clean(t.value).slice(0,80)}`}, ...raw.history].slice(0, 20); saveLocal(); push(k); } }, 1200);
    const el = document.querySelector(`[data-saved="${CSS.escape(k)}"]`); if (el) el.textContent = "Saved on this device";
    void e;
  }
});
/* Typing: no re-render on blur (that used to drop the card mid-edit and eat the next tap); the card stays until a vote,
   a filter change or leaving the page. Keep the box above the phone keyboard and hide the bottom bar meanwhile. */
/* Soft keyboard: never smooth-scroll on focus — that dismisses the keyboard on iOS/Android. */
function nudgeCommentBox(t){
  if (!t || document.activeElement !== t) return;
  const r = t.getBoundingClientRect(), vh = window.innerHeight;
  if (r.top < 70 || r.bottom > vh - 24) t.scrollIntoView({block: "center", behavior: "instant"});
}
function focusRemakeBox(key){
  const tryFocus = () => {
    // Prefer the lightbox reason box when its menu is open — crow on the card stays in the DOM
    // behind the overlay and would otherwise steal querySelector / focus (typed text looks "invisible").
    const sel = `textarea[data-key="${CSS.escape(key)}"]`;
    const t = document.querySelector(`#lb-menu.open ${sel}`) || document.querySelector(sel);
    if (!t) return false;
    t.focus();
    try { const n = t.value.length; t.setSelectionRange(n, n); } catch {}

});

  const t = ev.target; if (!(t.dataset && t.dataset.comment)) return;
  setTimeout(() => { if (!busyTyping()) { document.body.classList.remove("typing"); const all = pendingEntries(); document.getElementById("count").textContent = countText(all); document.getElementById("copy").disabled = !all.length; } }, 150);
});
document.getElementById("tab-home").onclick = () => go("#/");
document.getElementById("tab-summary").onclick = () => go("#/summary");
document.getElementById("copy").onclick = copyText;
document.addEventListener("click", (ev) => {
  if (!ev.target.closest) return;
  if (ev.target.closest("#sumtext") || ev.target.closest("#sumcopy")) copyText();

});
window.addEventListener("hashchange", onRoute);
window.addEventListener("storage", (e) => { if (e.key === LS_KEY) { store = loadLocal(); if (!busyTyping()) render(); } });

(async () => {
  render();
  let ss = null, meta = {};
  if (!STATIC) {
    try { const r = await fetch("/api/sets"); if (!r.ok) throw new Error(r.status); ss = await r.json(); if (!Array.isArray(ss)) throw new Error("bad");
      meta = await fetch("/api/meta").then((r) => r.json()).catch(() => ({})); }
    catch { STATIC = true; }
  }
  if (STATIC) {
    [ss, meta] = await Promise.all([fetch("data/sets.json", {cache:"no-cache"}).then((r) => r.json()), fetch("data/meta.json", {cache:"no-cache"}).then((r) => r.json()).catch(() => ({}))]);
    document.getElementById("h-note").textContent = "· online copy" + (meta.builtAt ? " · " + new Date(meta.builtAt).toLocaleDateString([], {month:"short", day:"numeric"}) : "");
  }
